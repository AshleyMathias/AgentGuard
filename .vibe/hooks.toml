# Project hooks: compliance-first workflow.
# Loaded automatically because this folder is trusted by Vibe.

# Injects the active rulesets (compliance/*.md) into the agent's context every
# time a session opens, so development work always starts with the rules loaded.
[[hooks]]
name = "compliance-load-rules"
type = "session_start"
command = "bash .vibe/hooks/compliance-context.sh"
timeout = 30.0
description = "Inject active compliance rules into the session context"

# After every file write/edit, nudge the agent to verify the change against the
# rules and remember to include its Compliance check in the final answer.
[[hooks]]
name = "compliance-edit-reminder"
type = "post_tool"
match = "re:write_file|edit"
command = "bash .vibe/hooks/edit-reminder.sh"
timeout = 30.0
description = "Remind the agent to verify each change against compliance rules"
